schema: spec-driven

# Project context.
# Agreed constraints for OpenSpec artifacts and workflows in this repo.
context: |
  exo-gltf is an Exo editor plugin (cross-origin, GitHub Pages project page
  https://mode777.github.io/exo-gltf/) that opens, previews, explores and
  lightly repairs glTF/GLB files. All agreed technical decisions live in
  docs/decisions.md - consult it before proposing any stack, architecture,
  layout, tooling or hosting choice. Locked in for the first iteration:
  three.js (WebGL2) renders, @gltf-transform models structure and
  serialization, Preact (React API) builds the editor UI, one manifest
  editor entry for **/*.{gltf,glb} with rendering "frame", permissions
  workspace:read + workspace:write + events:subscribe, vendored
  DRACO/KTX2/Meshopt decoders, npm-workspaces layout with an unmodified
  vendored @exo/plugin-sdk.
  Hard platform constraints: workspace reads are exact-path; discovery is
  available only through the shell-owned user picker (plugin/request-files,
  SDK 1.2.0+) and permissioned one-level directory listing
  (plugin/request-list + workspace:list, SDK 1.3.0+); recursive listing,
  globbing and search do not exist. A plugin writes only its own open
  document. Design around editor.limits and the 5 s save-response timeout;
  never hand-write postMessage - use the vendored SDK. The upstream API ask
  that unblocked M3 is resolved; docs/exo-editor-api-request.md section 8
  records the shipped shape. The vendored SDK is 1.1.0 and must be
  refreshed to 1.3.0 for M3.

